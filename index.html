<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsDay — Новости Ташкента</title>
<style>
  :root{
    --bg:#0f1419; --surface:#171e26; --surface-2:#1e2833; --border:#2a3642;
    --text:#e8edf2; --muted:#8b99a7; --brand:#ff5722; --brand-2:#ff8a65;
    --accent:#2dd4bf; --radius:14px; --maxw:1180px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

  /* Header */
  header{position:sticky;top:0;z-index:50;background:rgba(15,20,25,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
  .topbar{display:flex;align-items:center;gap:16px;height:64px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.5px}
  .logo .mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:linear-gradient(135deg,var(--brand),var(--brand-2));border-radius:9px;font-size:18px}
  .logo b{color:var(--brand)}
  .search{flex:1;max-width:440px;position:relative}
  .search input{width:100%;height:40px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;color:var(--text);padding:0 16px 0 40px;font-size:14px;outline:none}
  .search input:focus{border-color:var(--brand)}
  .search svg{position:absolute;left:14px;top:11px;opacity:.5}
  .spacer{flex:1}
  .lang{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px}
  .lang button{background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;cursor:pointer;transition:.15s}
  .lang button.active{background:var(--brand);color:#fff}
  .iconbtn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:999px;cursor:pointer;font-size:16px;display:inline-flex;align-items:center;justify-content:center;position:relative}
  .iconbtn .badge{position:absolute;top:-4px;right:-4px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 4px}

  /* Filters */
  .filters{border-bottom:1px solid var(--border);background:var(--bg)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:6px}
  .chip:hover{color:var(--text)}
  .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
  .chip .dot{width:7px;height:7px;border-radius:50%}

  .subbar{display:flex;align-items:center;gap:12px;padding:12px 0}
  .districtsel{position:relative}
  .districtsel select{appearance:none;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:8px 34px 8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;outline:none}
  .districtsel::after{content:"▾";position:absolute;right:12px;top:8px;color:var(--muted);pointer-events:none}
  .subbar .label{color:var(--muted);font-size:13px}
  .count{margin-left:auto;color:var(--muted);font-size:13px}

  /* Layout */
  main{padding:22px 0 60px}
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:26px;align-items:start}
  @media(max-width:900px){.grid{grid-template-columns:1fr}.side{display:none}}

  /* Cards */
  .feed{display:flex;flex-direction:column;gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.18s;display:grid;grid-template-columns:200px 1fr}
  .card:hover{border-color:#3a4a5a;transform:translateY(-2px)}
  .card .thumb{height:100%;min-height:150px;background-size:cover;background-position:center;position:relative}
  @media(max-width:560px){.card{grid-template-columns:1fr}.card .thumb{min-height:170px}}
  .card .body{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
  .cat{font-weight:800;letter-spacing:.3px;text-transform:uppercase;font-size:11px}
  .card h3{font-size:17px;line-height:1.3;letter-spacing:-.3px}
  .card p{color:var(--muted);font-size:13px}
  .cardfoot{display:flex;align-items:center;gap:12px;margin-top:auto;font-size:12px;color:var(--muted)}
  .cardfoot .src{display:flex;align-items:center;gap:5px}
  .verified{color:var(--accent);font-weight:700}
  .bk{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:17px;padding:4px}
  .bk.on{color:var(--brand)}
  .breaking{position:absolute;top:10px;left:10px;background:var(--brand);color:#fff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}

  /* Sidebar */
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:80px}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .panel h4{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:12px}
  .weather{display:flex;align-items:center;gap:14px}
  .weather .temp{font-size:34px;font-weight:800}
  .weather .wsub{color:var(--muted);font-size:13px}
  .trend{display:flex;flex-direction:column;gap:12px}
  .trend a{display:flex;gap:10px;font-size:13px;line-height:1.35}
  .trend .n{color:var(--brand);font-weight:800}
  .trend a:hover .t{color:var(--brand)}

  /* Modal */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);overflow-y:auto;padding:40px 16px}
  .modal.open{display:flex}
  .article{background:var(--surface);border:1px solid var(--border);border-radius:16px;max-width:720px;width:100%;overflow:hidden;animation:up .25s}
  @keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
  .article .hero{height:280px;background-size:cover;background-position:center}
  .article .content{padding:26px 30px 34px}
  .article h1{font-size:27px;line-height:1.22;letter-spacing:-.5px;margin:12px 0 14px}
  .article .lead{font-size:16px;color:#c3ccd6;margin-bottom:16px}
  .article .txt{color:#aeb9c4;font-size:15px;line-height:1.75}
  .article .txt p{margin-bottom:14px}
  .closeb{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.5);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
  .abar{display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
  .abar button{flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
  .abar button.primary{background:var(--brand);border-color:var(--brand);color:#fff}

  .empty{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty .ee{font-size:40px;margin-bottom:10px}
  footer{border-top:1px solid var(--border);padding:26px 0;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>

<header>
  <div class="wrap topbar">
    <a class="logo" href="#"><span class="mark">📰</span>News<b>Day</b></a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="search" type="text" placeholder="Поиск...">
    </div>
    <div class="spacer"></div>
    <div class="lang" id="lang">
      <button data-l="uz">O'z</button>
      <button data-l="uzc">Ўз</button>
      <button data-l="ru" class="active">Ру</button>
      <button data-l="en">En</button>
    </div>
    <button class="iconbtn" id="bkBtn" title="Закладки">🔖<span class="badge" id="bkCount" style="display:none">0</span></button>
  </div>
  <div class="filters">
    <div class="wrap">
      <div class="chips" id="cats"></div>
      <div class="subbar">
        <span class="label" id="districtLabel">Район:</span>
        <div class="districtsel"><select id="district"></select></div>
        <span class="count" id="count"></span>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="grid">
    <div>
      <div class="feed" id="feed"></div>
    </div>
    <aside class="side">
      <div class="panel">
        <h4 id="wTitle">Погода в Ташкенте</h4>
        <div class="weather"><span style="font-size:38px">☀️</span><div><div class="temp">+34°</div><div class="wsub" id="wSub">Ясно · ощущается +37°</div></div></div>
      </div>
      <div class="panel">
        <h4 id="tTitle">Популярное сейчас</h4>
        <div class="trend" id="trend"></div>
      </div>
      <div class="panel">
        <h4 id="digTitle">Дайджест</h4>
        <p style="color:var(--muted);font-size:13px;margin-bottom:12px" id="digText">Получайте главные новости района утром и вечером.</p>
        <button class="chip active" style="width:100%;justify-content:center" id="digBtn">🔔 Подписаться на дайджест</button>
      </div>
    </aside>
  </div>
</main>

<footer class="wrap">
  <div>NewsDay · Гиперлокальные новости Ташкента · Прототип MVP</div>
</footer>

<div class="modal" id="modal">
  <div class="article" style="position:relative">
    <button class="closeb" id="closeModal">✕</button>
    <div class="hero" id="aHero"></div>
    <div class="content">
      <div class="meta" id="aMeta"></div>
      <h1 id="aTitle"></h1>
      <div class="lead" id="aLead"></div>
      <div class="txt" id="aBody"></div>
      <div class="abar">
        <button class="primary" id="aBk">🔖 <span id="aBkT">В закладки</span></button>
        <button id="aShare">🔗 <span id="aShareT">Поделиться</span></button>
      </div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
